name: Nightly vacancies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly.yml"
  schedule:
    # 03:15 Moscow time (UTC+3)
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-vacancies
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore vacancy state
        id: vacancy-state
        uses: actions/cache/restore@v4
        with:
          path: work/state/jobs.sqlite3
          key: vacancy-state-${{ github.run_id }}
          restore-keys: |
            vacancy-state-

      - name: Initialize state
        if: steps.vacancy-state.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/state -Force | Out-Null
          python job_tracker.py --db work/state/jobs.sqlite3 telegram-init --force

      - name: Refresh vacancies
        run: python job_tracker.py --db work/state/jobs.sqlite3 sync --config config.direct.json

      - name: Build Telegram settings
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        shell: pwsh
        run: |
          python -c "import json,os,pathlib; f=json.load(open('config/telegram-filter.json',encoding='utf-8')); pathlib.Path('work/telegram-settings.json').write_text(json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'filter':f},ensure_ascii=False),encoding='utf-8')"

      - name: Notify about matching new vacancies
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python job_tracker.py --db work/state/jobs.sqlite3 telegram-notify --settings work/telegram-settings.json

      - name: Build public site data
        run: |
          python job_tracker.py --db work/state/jobs.sqlite3 export --output data/jobs.csv
          python job_tracker.py --db work/state/jobs.sqlite3 site-data --output site/vacancies.js

      - name: Save vacancy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/state/jobs.sqlite3
          key: vacancy-state-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

