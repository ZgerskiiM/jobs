name: Nightly vacancies
# Public Pages bootstrap: 2026-08-24

on:
  workflow_dispatch:

concurrency:
  group: nightly-vacancies
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SUBSCRIBERS_URL: ${{ vars.TELEGRAM_SUBSCRIBERS_URL }}
      TELEGRAM_SYNC_TOKEN: ${{ secrets.TELEGRAM_SYNC_TOKEN }}
      TELEGRAM_SITE_URL: ${{ vars.TELEGRAM_SITE_URL }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://devver.ru' }}
      DEPLOY_MODE: ${{ vars.DEPLOY_MODE || 'https' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore vacancy state
        id: vacancy-state
        uses: actions/cache/restore@v4
        with:
          path: work/state/jobs.sqlite3
          key: vacancy-state-${{ github.run_id }}
          restore-keys: |
            vacancy-state-

      - name: Initialize state
        if: steps.vacancy-state.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/state -Force | Out-Null
          python job_tracker.py --db work/state/jobs.sqlite3 telegram-init --force

      - name: Refresh vacancies
        continue-on-error: true
        run: python job_tracker.py --db work/state/jobs.sqlite3 sync --config config.direct.json

      - name: Build Telegram settings
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.TELEGRAM_SUBSCRIBERS_URL == ''
        shell: pwsh
        run: |
          python -c "import json,os,pathlib; f=json.load(open('config/telegram-filter.json',encoding='utf-8')); pathlib.Path('work/telegram-settings.json').write_text(json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'filter':f},ensure_ascii=False),encoding='utf-8')"

      - name: Notify about matching new vacancies
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.TELEGRAM_SUBSCRIBERS_URL == ''
        run: python job_tracker.py --db work/state/jobs.sqlite3 telegram-notify --settings work/telegram-settings.json

      - name: Notify users about matching new vacancies
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_SUBSCRIBERS_URL != '' && env.TELEGRAM_SYNC_TOKEN != '' && env.TELEGRAM_SITE_URL != ''
        run: python job_tracker.py --db work/state/jobs.sqlite3 telegram-notify-users --subscribers-url "$TELEGRAM_SUBSCRIBERS_URL" --sync-token "$TELEGRAM_SYNC_TOKEN" --site-url "$TELEGRAM_SITE_URL"

      - name: Build public site data
        run: |
          python job_tracker.py --db work/state/jobs.sqlite3 export --output data/jobs.csv
          python job_tracker.py --db work/state/jobs.sqlite3 site-data --output data/vacancies.js
          python job_tracker.py --db work/state/jobs.sqlite3 refresh-report --output frontend/public/vacancy-refresh.json

      - name: Build website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The vacancy catalog is generated in this job. Publish the resulting
      # web image to the same staging host as the regular staging workflow so
      # the live catalog is refreshed together with the nightly statistics.
      - name: Resolve nightly web image
        id: nightly-image
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "web=ghcr.io/$repository/web:nightly-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish nightly web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.nightly-image.outputs.web }}

      - name: Configure SSH for staging refresh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing staging variable DEPLOY_HOST" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing staging variable DEPLOY_USER" >&2; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing staging variable DEPLOY_PATH" >&2; exit 1; }
          test -n "$DEPLOY_URL" || { echo "Missing staging variable DEPLOY_URL" >&2; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing staging secret SSH_PRIVATE_KEY" >&2; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing staging secret SSH_KNOWN_HOSTS" >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$remote" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp docker-compose.yml docker-compose.prod.yml "$remote:$DEPLOY_PATH/"
          scp deploy/Caddyfile deploy/remote-deploy.sh "$remote:$DEPLOY_PATH/deploy/"

      - name: Log in to GHCR on staging
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          printf '%s' "$GHCR_TOKEN" | ssh "$remote" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Restart staging with refreshed catalog
        shell: bash
        env:
          NIGHTLY_WEB_IMAGE: ${{ steps.nightly-image.outputs.web }}
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          api_image="ghcr.io/$repository/api:staging"
          crawler_image="ghcr.io/$repository/crawler:staging"
          ssh "$remote" "cd '$DEPLOY_PATH' && DEPLOY_MODE='$DEPLOY_MODE' API_IMAGE='$api_image' WEB_IMAGE='$NIGHTLY_WEB_IMAGE' CRAWLER_IMAGE='$crawler_image' bash deploy/remote-deploy.sh"

      - name: Smoke test refreshed staging
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$DEPLOY_URL/healthz/"
          curl --fail --silent --show-error "$DEPLOY_URL/vacancy-refresh.json"

      - name: Save vacancy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/state/jobs.sqlite3
          key: vacancy-state-${{ github.run_id }}

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
