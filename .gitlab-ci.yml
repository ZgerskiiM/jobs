stages:
  - validate
  - refresh
  - build
  - deploy
  - verify

variables:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_COMMIT_SHA"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

backend_tests:
  stage: validate
  image: python:${PYTHON_VERSION}-slim
  variables:
    DJANGO_SECRET_KEY: "ci-only-secret-key-with-more-than-32-characters"
    DJANGO_DEBUG: "1"
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - python -m unittest discover -s tests -v
    - cd backend
    - python manage.py check
    - python manage.py test

frontend_build:
  stage: validate
  image: node:${NODE_VERSION}-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build

container_build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  needs:
    - backend_tests
    - frontend_build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - docker info
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      fi
    - docker build --pull -f backend/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/api:latest" .
    - docker build --pull -f frontend/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/web:latest" .
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        docker push "$CI_REGISTRY_IMAGE/api:$IMAGE_TAG"
        docker push "$CI_REGISTRY_IMAGE/api:latest"
        docker push "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG"
        docker push "$CI_REGISTRY_IMAGE/web:latest"
      fi

deploy_staging:
  stage: deploy
  image: alpine:3.22
  needs:
    - container_build
  environment:
    name: staging
    url: $DEPLOY_URL
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - API_IMAGE="$CI_REGISTRY_IMAGE/api:$IMAGE_TAG" WEB_IMAGE="$CI_REGISTRY_IMAGE/web:$IMAGE_TAG" bash deploy/ci-deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

smoke_staging:
  stage: verify
  image: alpine:3.22
  needs:
    - deploy_staging
  before_script:
    - apk add --no-cache curl
  script:
    - curl --fail --silent --show-error --retry 10 --retry-delay 5 "$DEPLOY_URL/healthz/"
    - curl --fail --silent --show-error "$DEPLOY_URL/api/auth/config/"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'

deploy_production:
  stage: deploy
  image: alpine:3.22
  needs:
    - container_build
  environment:
    name: production
    url: $DEPLOY_URL
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - API_IMAGE="$CI_REGISTRY_IMAGE/api:$IMAGE_TAG" WEB_IMAGE="$CI_REGISTRY_IMAGE/web:$IMAGE_TAG" bash deploy/ci-deploy.sh
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

refresh_catalog:
  stage: refresh
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: vacancy-state
    paths:
      - work/state/jobs.sqlite3
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - mkdir -p work/state
  script:
    - python job_tracker.py --db work/state/jobs.sqlite3 sync --config config.direct.json
    - python job_tracker.py --db work/state/jobs.sqlite3 export --output data/jobs.csv
    - python job_tracker.py --db work/state/jobs.sqlite3 site-data --output data/vacancies.js
    - |
      if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
        python -c "import json,os,pathlib; f=json.load(open('config/telegram-filter.json',encoding='utf-8')); pathlib.Path('work/telegram-settings.json').write_text(json.dumps({'chat_id':os.environ['TELEGRAM_CHAT_ID'],'filter':f},ensure_ascii=False),encoding='utf-8')"
        python job_tracker.py --db work/state/jobs.sqlite3 telegram-notify --settings work/telegram-settings.json
      fi
  artifacts:
    paths:
      - data/jobs.csv
      - data/vacancies.js
    expire_in: 2 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

scheduled_web_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  needs:
    - refresh_catalog
  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -f frontend/Dockerfile -t "$CI_REGISTRY_IMAGE/web:scheduled-$CI_PIPELINE_ID" .
    - docker push "$CI_REGISTRY_IMAGE/web:scheduled-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

deploy_scheduled_catalog:
  stage: deploy
  image: alpine:3.22
  needs:
    - scheduled_web_image
  environment:
    name: production
    url: $DEPLOY_URL
  before_script:
    - apk add --no-cache openssh-client bash
  script:
    - API_IMAGE="$CI_REGISTRY_IMAGE/api:latest" WEB_IMAGE="$CI_REGISTRY_IMAGE/web:scheduled-$CI_PIPELINE_ID" bash deploy/ci-deploy.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
